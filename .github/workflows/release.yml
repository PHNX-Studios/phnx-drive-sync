name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # the FUSE sidecar ships as a static musl binary; musl-tools provides the
      # musl C compiler for its bundled SQLite
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # build.sh installs the vendored dependency trees itself when missing.
      - name: Build portable tarball
        run: bash packaging/build.sh

      - name: Upload tarball + manifest fragment
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/latest-*.json
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Merge per-arch manifests
        run: bun packaging/merge-manifests.mjs latest.json dist/latest-*.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-run after a partial failure: update the existing release's assets
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz latest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.tar.gz latest.json
          fi
