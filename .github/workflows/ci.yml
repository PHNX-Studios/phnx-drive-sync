name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff + Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `ruff check` with the pyproject.toml config; pinned for
      # reproducible lint results.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"

      # Markdown docs via `.markdownlint-cli2.jsonc`; pinned for reproducible
      # results. Globs are explicit so the vendored SDK docs are not linted.
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            *.md
            .github/**/*.md

  test:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Each vendored package installs its own tree; the repo-root node_modules
      # is a committed symlink into vendor/cli, which the dev commands rely on.
      - name: Install vendored dependencies
        run: |
          for d in vendor/cli vendor/client/js vendor/incubating/account/js; do
            ( cd "$d" && bun install --frozen-lockfile )
          done

      - name: Type-check (strict)
        run: ./node_modules/.bin/tsc -p tsconfig.json

      # Scoped to test/: a bare `bun test` would also walk the ~930 vendored SDK tests.
      - name: Unit tests
        run: bun test test/

  gui:
    name: GUI (byte-compile, unit tests, headless smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The system python is used deliberately: PyGObject (gi) ships as distro
      # packages and is not pip-installable, so setup-python would hide it.
      - name: Install GTK4, Libadwaita and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 xvfb

      - name: Byte-compile the GUI and tray
        run: python3 -m compileall -q gui tray test/gui test/tray test/sidecar

      # Under Xvfb: some tests build real GTK widgets (context-menu buttons, the
      # listing reconcile). With no display those are skipped, and on GTK 4.14
      # widget creation without a display segfaults, so give them a display.
      - name: GUI unit tests
        run: xvfb-run -a python3 -m unittest discover -s test/gui -p 'test_*.py' -v

      - name: Tray menu structure tests
        run: python3 -m unittest discover -s test/tray -p 'test_*.py' -v

      - name: Headless smoke (build the window and exit)
        run: xvfb-run -a python3 gui/phnx-drive-sync-gui.py --self-check

  sidecar:
    name: FUSE sidecar characterization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Rust sidecar (fmt, clippy, unit tests, release build)
        working-directory: sidecar
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked

      # Mounts real FUSE filesystems on temp dirs against a scripted fake engine
      # (test/sidecar/harness.py); the binary is the release build above.
      - name: Sidecar characterization tests
        run: python3 -m unittest discover -s test/sidecar -p 'test_*.py' -v

  build:
    name: Build release tarball (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # the FUSE sidecar ships as a static musl binary; musl-tools provides the
      # musl C compiler for its bundled SQLite
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools fuse3

      - name: Build portable tarball
        run: bash packaging/build.sh

      # the shipped static binary, not the dev build: same suite, real artifact
      - name: Characterization tests against the tarball's sidecar
        run: |
          bin="$(find dist -path '*/phnx-drive-sync-*-linux-*/phnx-drive-sync-fuse' -type f | head -n1)"
          PHNX_SIDECAR_CMD="$PWD/$bin" python3 -m unittest discover -s test/sidecar -p 'test_*.py'

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: phnx-drive-sync-tarball-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/latest-*.json
          if-no-files-found: error
