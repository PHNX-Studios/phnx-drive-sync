name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Each vendored package installs its own tree; the repo-root node_modules
      # is a committed symlink into vendor/cli, which the dev commands rely on.
      - name: Install vendored dependencies
        run: |
          for d in vendor/cli vendor/client/js vendor/incubating/account/js; do
            ( cd "$d" && bun install --frozen-lockfile )
          done

      - name: Type-check (strict)
        run: ./node_modules/.bin/tsc -p tsconfig.json

      # Scoped to test/: a bare `bun test` would also walk the ~930 vendored SDK tests.
      - name: Unit tests
        run: bun test test/

  build:
    name: Build release tarball (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build portable tarball
        run: bash packaging/build.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: phnx-drive-sync-tarball-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/latest-*.json
          if-no-files-found: error
