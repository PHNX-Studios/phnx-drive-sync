name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff + Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `ruff check` with the pyproject.toml config; pinned for
      # reproducible lint results.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"

      # Markdown docs via `.markdownlint-cli2.jsonc`; pinned for reproducible
      # results. Globs are explicit so the vendored SDK docs are not linted.
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            *.md
            .github/**/*.md

  test:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Each vendored package installs its own tree; the repo-root node_modules
      # is a committed symlink into vendor/cli, which the dev commands rely on.
      - name: Install vendored dependencies
        run: |
          for d in vendor/cli vendor/client/js vendor/incubating/account/js; do
            ( cd "$d" && bun install --frozen-lockfile )
          done

      - name: Type-check (strict)
        run: ./node_modules/.bin/tsc -p tsconfig.json

      # Scoped to test/: a bare `bun test` would also walk the ~930 vendored SDK tests.
      - name: Unit tests
        run: bun test test/

  gui:
    name: GUI (byte-compile, unit tests, headless smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The system python is used deliberately: PyGObject (gi) ships as distro
      # packages and is not pip-installable, so setup-python would hide it.
      - name: Install GTK4, Libadwaita and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 xvfb

      - name: Byte-compile the GUI and tray
        run: python3 -m compileall -q gui tray test/gui test/tray

      # Under Xvfb: some tests build real GTK widgets (context-menu buttons, the
      # listing reconcile). With no display those are skipped, and on GTK 4.14
      # widget creation without a display segfaults, so give them a display.
      - name: GUI unit tests
        run: xvfb-run -a python3 -m unittest discover -s test/gui -p 'test_*.py' -v

      - name: Tray menu structure tests
        run: python3 -m unittest discover -s test/tray -p 'test_*.py' -v

      - name: Headless smoke (build the window and exit)
        run: xvfb-run -a python3 gui/phnx-drive-sync-gui.py --self-check

  build:
    name: Build release tarball (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build portable tarball
        run: bash packaging/build.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: phnx-drive-sync-tarball-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/latest-*.json
          if-no-files-found: error
