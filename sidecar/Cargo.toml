[package]
name = "phnx-drive-sync-fuse"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "FUSE sidecar for PHNX Drive Sync: files-on-demand mount over the sync tree"
publish = false

[dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
lexopt = "0.3"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha1 = "0.11"
signal-hook = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
